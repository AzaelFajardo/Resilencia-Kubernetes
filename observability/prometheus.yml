global:
  scrape_interval: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: microservices
    static_configs:
      - targets:
          - "order-service:8000"
          - "payment-service:8000"
          - "notification-service:8000"
          - "user-service:8000"
          - "inventory-service:8000"