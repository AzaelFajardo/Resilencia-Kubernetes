<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resilencia-Kubernetes — Panel de control</title>
<link rel="stylesheet" href="/css/main.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo"></span>
    <div>
      <h1>RESILENCIA-KUBERNETES</h1>
      <span class="sub">Panel de control</span>
    </div>
  </div>
  <div class="health" id="healthStrip" data-tip="Estado en vivo de los 5 microservicios (GET /health)"></div>
  <div class="refresh-ctl">
    <span class="lbl">refresco</span>
    <input id="refreshInterval" type="number" min="1" step="1" value="5" data-tip="Intervalo de auto-refresco de métricas y gráficas, en segundos (mínimo 1).">
    <span class="lbl">s</span>
    <button id="refreshNow" class="btn sm secondary" data-tip="Actualizar todas las métricas ahora">⟳ Actualizar</button>
  </div>
  <div class="links">
    <a href="http://localhost:3001" target="_blank" data-tip="Visualización de métricas (Grafana)">Grafana</a>
    <a href="http://localhost:16687" target="_blank" data-tip="Visualización de trazas distribuidas (Jaeger)">Jaeger</a>
    <a href="http://localhost:9091" target="_blank" data-tip="Consultas y objetivos de métricas (Prometheus)">Prometheus</a>
  </div>
</header>

<nav class="tabs" id="tabs">
  <a href="#/home" data-tab="home">Inicio</a>
  <a href="#/orders" data-tab="orders">Órdenes</a>
  <a href="#/pruebas" data-tab="pruebas">Pruebas</a>
  <a href="#/users" data-tab="users">Clientes</a>
  <a href="#/inventory" data-tab="inventory">Inventario</a>
  <a href="#/payments" data-tab="payments">Pagos</a>
  <a href="#/notifications" data-tab="notifications">Notificaciones</a>
  <a href="#/resilience" data-tab="resilience">Resiliencia</a>
  <a href="#/observability" data-tab="observability">Observabilidad</a>
  <a href="#/kubernetes" data-tab="kubernetes">Kubernetes</a>
</nav>

<main id="view" class="view"></main>

<div id="toasts" class="toasts"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
