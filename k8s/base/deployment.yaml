apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: order-service:latest
          imagePullPolicy: Never
          resources:
            requests:
              cpu: "100m"
            limits:
              cpu: "200m"
          envFrom:
            - secretRef:
                name: resilencia-secret
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: USER_SERVICE_URL
              value: "http://user-service:8000"
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory-service:8000"
            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service:8000"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:8000"
            - name: RETRY_ENABLED
              value: "false"
            - name: RETRY_COUNT
              value: "3"
            - name: RETRY_DELAY_MS
              value: "100"
            - name: HTTP_TIMEOUT
              value: "5.0"
          ports:
            - containerPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.99.0
          ports:
            - containerPort: 4317
            - containerPort: 4318
            - containerPort: 8889
---
