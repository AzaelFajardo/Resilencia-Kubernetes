apiVersion: v1
kind: Secret
metadata:
  name: resilencia-secret
type: Opaque
# Development defaults for the local/simulation stack.
# For any environment exposed to the internet, override these with real
# credentials (kubectl create secret / sealed-secrets / external secrets).
# NOTE: stringData is plaintext in this file; do NOT commit real credentials.
stringData:
  POSTGRES_USER: "resilencia"
  POSTGRES_PASSWORD: "resilencia_secret"
  POSTGRES_DB: "resilencia_db"
  DATABASE_URL: "postgresql://resilencia:resilencia_secret@postgres:5432/resilencia_db"
  GF_SECURITY_ADMIN_PASSWORD: "admin"
